# CascadeSec's pre-commit hooks (docs/cli-spec.md §7). In a repository's
# .pre-commit-config.yaml:
#
#   - repo: https://github.com/konradkelly/CascadeSec
#     rev: <a release tag or commit>
#     hooks:
#       - id: cascadesec-docker      # needs only Docker
#       # or: - id: cascadesec       # runs the installed CLI
#
# then `pre-commit install --hook-type pre-push`. Both scan with the
# pipeline's own scanner, pinned by digest, under --network none, and judge
# a change against the version before it with one copy of the same code.
# `cascadesec` runs the CascadeSec CLI, which must be installed (pipx install
# ...; see cli/README.md) along with Docker. `cascadesec-docker` needs only
# Docker: pre-commit runs the hook image, which is the scanner image with
# the CLI on top.
#
# On push by default (decision D6): a cold scan is 10-20 seconds, which a
# hook on every commit would make every commit pay. To run it on commit
# instead, set `stages: [pre-commit]` on the hook in your config.

- id: cascadesec
  name: CascadeSec IaC scan
  description: Scan changed IaC with the CascadeSec pipeline's own scanner, offline, and block on the findings the change brought at or above --fail-on (default high), after the baseline.
  entry: cascadesec hook
  language: system
  # What the scanner admits: its SNAPSHOT_SUFFIXES, plus the .json and
  # .template files it sniffs for ARM and CloudFormation. cli/tests/
  # test_hook.py holds this to iac-scanner's own list.
  files: \.(tf|tf\.json|tfvars|tfvars\.json|tofu|tofu\.json|ya?ml|bicep|json|template)$
  pass_filenames: true
  # One scan for all the changed files. pre-commit would otherwise split them
  # across parallel invocations, each a cold container.
  require_serial: true
  stages: [pre-push]

- id: cascadesec-docker
  name: CascadeSec IaC scan (Docker)
  description: The cascadesec hook in its own image, so only Docker is needed.
  # pre-commit appends these tokens to its own `docker run ... -v
  # <repo>:/src`: --network none isolates the scan, and the two refs give
  # the hook the push's range, which `docker run` would not pass on. The
  # image is ghcr.io/konradkelly/cascadesec-hook, built on
  # ghcr.io/konradkelly/cascadesec-scanner@sha256:a60b6aaae929ed7799ca9869b427763bd64efa0aee1013bc2a09f1198ad50c8b
  # (the digest scan.py's SCANNER_IMAGE pins; cli/tests/test_hook.py holds
  # all three together). Its entrypoint is `cascadesec hook`.
  entry: --network none -e PRE_COMMIT_FROM_REF -e PRE_COMMIT_TO_REF ghcr.io/konradkelly/cascadesec-hook@sha256:73af04c3c2e15684460dc1e8058a1bdd2787429dc61b9e6a3844e66202e91289
  language: docker_image
  files: \.(tf|tf\.json|tfvars|tfvars\.json|tofu|tofu\.json|ya?ml|bicep|json|template)$
  pass_filenames: true
  require_serial: true
  stages: [pre-push]
